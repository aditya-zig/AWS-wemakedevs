services:
  toxiproxy:
    build:
      context: .
      dockerfile: services/toxiproxy/Dockerfile
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8666:8666"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    networks: [verifiai]
    restart: unless-stopped

  zap:
    build:
      context: .
      dockerfile: services/zap/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 384
    security_opt:
      - no-new-privileges:true
    networks: [verifiai]
    restart: unless-stopped

  external-engines:
    build:
      context: .
      dockerfile: services/external-engines/Dockerfile
    depends_on:
      - toxiproxy
      - zap
      - mirofish
    environment:
      PORT: "8789"
      TOXIPROXY_URL: "http://toxiproxy:8474"
      VERIFIAI_ZAP_URL: "http://zap:8080"
      VERIFIAI_MIROFISH_URL: "http://mirofish:5001"
      STRIX_LLM: "${STRIX_LLM:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    networks: [verifiai]
    restart: unless-stopped

  browser-use:
    build:
      context: .
      dockerfile: services/browser-use-runner/Dockerfile
    environment:
      PORT: "8792"
      VERIFIAI_BROWSER_USE_MODEL: "${VERIFIAI_BROWSER_USE_MODEL:-gpt-5-mini}"
      VERIFIAI_BROWSER_USE_MODEL_BASE_URL: "${VERIFIAI_BROWSER_USE_MODEL_BASE_URL:-https://openrouter.ai/api/v1}"
      VERIFIAI_BROWSER_USE_MODEL_API_KEY: "${VERIFIAI_BROWSER_USE_MODEL_API_KEY:-}"
    ports:
      - "127.0.0.1:8792:8792"
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    networks: [verifiai]
    restart: unless-stopped

  cua:
    build:
      context: .
      dockerfile: services/cua-runner/Dockerfile
    environment:
      PORT: "8791"
      VERIFIAI_CUA_MODEL: "${VERIFIAI_CUA_MODEL:-openai/gpt-5.4-mini}"
      VERIFIAI_CUA_PROVIDER: "${VERIFIAI_CUA_PROVIDER:-docker}"
      VERIFIAI_CUA_MODEL_API_KEY: "${VERIFIAI_CUA_MODEL_API_KEY:-}"
      VERIFIAI_CUA_MODEL_API_BASE: "${VERIFIAI_CUA_MODEL_API_BASE:-}"
      CUA_API_KEY: "${CUA_API_KEY:-}"
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cua-artifacts:/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    networks: [verifiai]
    restart: unless-stopped

  mirofish:
    build:
      context: .
      dockerfile: services/mirofish/Dockerfile
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5001"
      FLASK_DEBUG: "False"
      LLM_API_KEY: "${MIROFISH_LLM_API_KEY:-}"
      LLM_BASE_URL: "${MIROFISH_LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL_NAME: "${MIROFISH_LLM_MODEL_NAME:-gpt-4o-mini}"
      ZEP_API_KEY: "${ZEP_API_KEY:-}"
      OASIS_DEFAULT_MAX_ROUNDS: "${MIROFISH_MAX_ROUNDS:-10}"
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - mirofish-data:/src/MiroFish/backend/uploads
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    networks: [verifiai]
    restart: unless-stopped

networks:
  verifiai:
    name: verifiai-agent-local

volumes:
  cua-artifacts:
  mirofish-data:
