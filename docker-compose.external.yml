services:
  toxiproxy:
    build:
      context: .
      dockerfile: services/toxiproxy/Dockerfile
    ports:
      - "8474:8474"
      - "8666:8666"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  external-engines:
    build:
      context: .
      dockerfile: services/external-engines/Dockerfile
    depends_on:
      - toxiproxy
    environment:
      PORT: "8789"
      TOXIPROXY_URL: "http://toxiproxy:8474"
      STRIX_LLM: "${STRIX_LLM:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
    ports:
      - "8789:8789"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
