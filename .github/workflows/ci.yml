name: VERIFIAI CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify pull request auth/unit integration
        if: github.event_name == 'pull_request'
        run: npm run external:policy && npm run typecheck && npm test
      - name: Verify full main suite
        if: github.event_name != 'pull_request'
        run: npm run check
