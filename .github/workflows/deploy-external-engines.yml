name: VERIFIAI External Engine Host

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or destroy the bounded external-engine host
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  external-engine-host:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      VERIFIAI_TARGET_STACK: ${{ vars.VERIFIAI_TARGET_STACK || 'verifiai-real-target' }}
      VERIFIAI_ENGINE_STACK: ${{ vars.VERIFIAI_ENGINE_STACK || 'verifiai-external-engines' }}
      VERIFIAI_ENGINE_SUBNET_ID: ${{ vars.VERIFIAI_ENGINE_SUBNET_ID }}
      VERIFIAI_ENGINE_SECRET_ARN: ${{ secrets.VERIFIAI_ENGINE_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${AWS_ROLE_ARN:-}" ] || { echo "::error::AWS_ROLE_ARN is required"; exit 1; }
          if [ "${{ inputs.action }}" = "deploy" ]; then
            [ -n "${VERIFIAI_ENGINE_SUBNET_ID:-}" ] || { echo "::error::VERIFIAI_ENGINE_SUBNET_ID is required"; exit 1; }
            [ -n "${VERIFIAI_ENGINE_SECRET_ARN:-}" ] || { echo "::error::VERIFIAI_ENGINE_SECRET_ARN is required"; exit 1; }
          fi

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy engine host
        if: inputs.action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks --stack-name "$VERIFIAI_ENGINE_STACK" >/dev/null 2>&1; then
            aws cloudformation delete-stack --stack-name "$VERIFIAI_ENGINE_STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$VERIFIAI_ENGINE_STACK"
          fi
          echo "External-engine stack removed." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve target network
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          stack_param() {
            aws cloudformation describe-stacks --stack-name "$VERIFIAI_TARGET_STACK"               --query "Stacks[0].Parameters[?ParameterKey=='$1'].ParameterValue | [0]" --output text
          }
          stack_output() {
            aws cloudformation describe-stacks --stack-name "$VERIFIAI_TARGET_STACK"               --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          values=(
            "VERIFIAI_ENGINE_VPC_ID=$(stack_param VpcId)"
            "VERIFIAI_ENGINE_VPC_CIDR=$(stack_param VpcCidr)"
            "VERIFIAI_AUDITOR_SECURITY_GROUP=$(stack_output AuditorSecurityGroupId)"
            "VERIFIAI_TARGET_SECURITY_GROUP=$(stack_output TargetSecurityGroupId)"
          )
          for item in "${values[@]}"; do
            value="${item#*=}"
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::Missing target-stack network value: ${item%%=*}"
              exit 1
            fi
            echo "$item" >> "$GITHUB_ENV"
          done

      - name: Deploy bounded real-engine host
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy             --stack-name "$VERIFIAI_ENGINE_STACK"             --template-file infra/aws/external-engine-host.yml             --capabilities CAPABILITY_IAM             --no-fail-on-empty-changeset             --parameter-overrides               "VpcId=$VERIFIAI_ENGINE_VPC_ID"               "VpcCidr=$VERIFIAI_ENGINE_VPC_CIDR"               "EngineSubnetId=$VERIFIAI_ENGINE_SUBNET_ID"               "AuditorSecurityGroupId=$VERIFIAI_AUDITOR_SECURITY_GROUP"               "TargetSecurityGroupId=$VERIFIAI_TARGET_SECURITY_GROUP"               "EngineSecretArn=$VERIFIAI_ENGINE_SECRET_ARN"               "SourceCommit=$GITHUB_SHA"

      - name: Resolve engine host
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks --stack-name "$VERIFIAI_ENGINE_STACK"               --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          instance_id="$(output EngineInstanceId)"
          external_url="$(output ExternalEngineUrl)"
          cua_url="$(output CuaUrl)"
          browser_url="$(output BrowserUseUrl)"
          for pair in             "VERIFIAI_ENGINE_INSTANCE_ID=$instance_id"             "VERIFIAI_EXTERNAL_ENGINE_URL=$external_url"             "VERIFIAI_CUA_URL=$cua_url"             "VERIFIAI_BROWSER_USE_URL=$browser_url"; do
            value="${pair#*=}"
            [ -n "$value" ] && [ "$value" != "None" ] || { echo "::error::Missing engine-stack output: ${pair%%=*}"; exit 1; }
            echo "$pair" >> "$GITHUB_ENV"
          done

      - name: Wait for SSM registration
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            state="$(aws ssm describe-instance-information               --filters "Key=InstanceIds,Values=$VERIFIAI_ENGINE_INSTANCE_ID"               --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)"
            [ "$state" = "Online" ] && exit 0
            sleep 15
          done
          echo "::error::Engine host never became available through SSM"
          exit 1

      - name: Verify real engine health on host
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command             --instance-ids "$VERIFIAI_ENGINE_INSTANCE_ID"             --document-name AWS-RunShellScript             --comment "VERIFIAI real-engine health proof"             --parameters commands='[
              "set -euo pipefail",
              "for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8789/health >/tmp/external-health.json && curl -fsS http://127.0.0.1:8791/health >/tmp/cua-health.json && curl -fsS http://127.0.0.1:8792/health >/tmp/browser-health.json && break; sleep 15; done",
              "test -s /tmp/external-health.json",
              "test -s /tmp/cua-health.json",
              "test -s /tmp/browser-health.json",
              "cat /tmp/external-health.json",
              "cat /tmp/cua-health.json",
              "cat /tmp/browser-health.json",
              "cd /opt/verifiai && docker compose --env-file .engine.env -f docker-compose.external.yml ps"
            ]'             --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$VERIFIAI_ENGINE_INSTANCE_ID"
          status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$VERIFIAI_ENGINE_INSTANCE_ID" --query Status --output text)"
          stdout="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$VERIFIAI_ENGINE_INSTANCE_ID" --query StandardOutputContent --output text)"
          stderr="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$VERIFIAI_ENGINE_INSTANCE_ID" --query StandardErrorContent --output text)"
          printf '%s\n' "$stdout"
          [ "$status" = "Success" ] || { printf '%s\n' "$stderr" >&2; exit 1; }

      - name: Publish engine endpoints
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          {
            echo "### External-engine host ready"
            echo
            echo "- Instance: `$VERIFIAI_ENGINE_INSTANCE_ID`"
            echo "- External engines: `$VERIFIAI_EXTERNAL_ENGINE_URL`"
            echo "- Cua: `$VERIFIAI_CUA_URL`"
            echo "- Browser Use: `$VERIFIAI_BROWSER_USE_URL`"
            echo "- Auto-shutdown is enforced by the CloudFormation stack."
          } >> "$GITHUB_STEP_SUMMARY"
